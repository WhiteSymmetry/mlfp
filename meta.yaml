# meta.yaml

package:
  name: mlfp
  version: "0.1.4"

source:
  url: https://files.pythonhosted.org/packages/4e/cb/7cb2adbd0cdc8d14f4930284e0467d789ea947fe779d14a635675f87e959/mlfp-0.1.4.tar.gz
  blake2b-256: 4ecb7cb2adbd0cdc8d14f4930284e0467d789ea947fe779d14a635675f87e959
  
build:
  noarch: python
  #script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed
  script: |
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  # --no-deps: Bağımlılıkları pip kurmasın (conda kuracak)
  # --no-build-isolation: Daha hızlı build
  number: 0


requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - numpy
  run:
    - python >=3.11
    - numpy
    - matplotlib
    - scipy
    - mpmath
  build:
    - python >=3.11
    - pip
    - setuptools
    - numpy
    - matplotlib
    - scipy
    - mpmath

test:
  requires:
    - matplotlib
    - scipy
    - numpy
    - mpmath
  imports:
    - numpy
    - matplotlib
    - scipy
    - mpmath


test:
  imports:
    - mlfp
  commands:
    - python -c "import mlfp; print(mlfp.__version__)"

