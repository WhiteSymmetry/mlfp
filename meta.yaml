# meta.yaml

package:
  name: mlfp
  version: "0.1.0"

source:
  url: https://files.pythonhosted.org/packages/fb/11/26201560960fdaaa58946f799116d9068704889ee1be9f9a60f76d002ac3/mlfp-0.1.0.tar.gz
  blake2b-256: fb1126201560960fdaaa58946f799116d9068704889ee1be9f9a60f76d002ac3
  
build:
  noarch: python
  #script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed
  script: |
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  # --no-deps: Bağımlılıkları pip kurmasın (conda kuracak)
  # --no-build-isolation: Daha hızlı build
  number: 0


requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - numpy
  run:
    - python >=3.11
    - numpy
    - matplotlib
    - scipy
  build:
    - python >=3.11
    - pip
    - setuptools
    - numpy
    - matplotlib
    - scipy

test:
  requires:
    - matplotlib
    - scipy
    - numpy
  imports:
    - numpy
    - matplotlib
    - scipy


test:
  imports:
    - mlfp
  commands:
    - python -c "import mlfp; print(mlfp.__version__)"

about:
  home: https://github.com/WhiteSymmetry/mlfp
  license: MIT
  license_file: LICENSE
  summary: mlfp; Mittag-Leffler and Prabhakar function, MLF
  description: |
    mlfp; Mittag-Leffler and Prabhakar function, MLF
  doc_url: https://github.com/WhiteSymmetry/mlfp
