# .ruff.toml — standalone ruff config (tool.ruff öneki YOK)

target-version = "py311"
line-length = 88
src = ["src", "tests"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sıralaması)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python sözdizimi)
    "B",    # flake8-bugbear (yaygın hatalar)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — formatter hallediyor
    "E741",   # ambiguous variable name (l, I, O)
    "RUF001", # unicode ambiguous char (Türkçe metinlerde sık)
]

[lint.per-file-ignores]
"tests/*" = ["S101", "E501"]       # test dosyalarında assert serbest
"docs/*"  = ["E501", "RUF001"]     # belgede unicode OK

[lint.isort]
known-first-party = ["mlfp"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-ending = "lf"
docstring-code-format = true
