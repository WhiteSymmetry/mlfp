# pyproject.toml

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfp"
version = "0.1.7"

# Diğer proje bilgileri (isteğe bağlı ama tavsiye edilir)
authors = [
    { name="Mehmet Keçeci", email="enfo@tuta.io" },
]
maintainers = [
    {name="Mehmet Keçeci", email="enfo@tuta.io"}
]
description = "mlfp; Mittag-Leffler and Prabhakar function, MLF"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Ana bağımlılıklarınız
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "mpmath",
    "pfapack",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "scipy",
    "matplotlib",
    "numpy",
    "mpmath",
    "pfapack",

]

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [{include-group = "test"}]
test = ["pytest"]

[tool.pytest.ini_options]
log_level = "INFO"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
minversion = "6.0"
testpaths = [
    "tests",
    "integration",
]

[tool.readthedocs]
version = 2
build.image = "stable"
python.version = "3.14"
configuration = "docs/conf.py"  # Build konfigürasyonu belirtin

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "E741", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"docs/*"  = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["mlfp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.urls]
"Homepage" = "https://github.com/WhiteSymmetry/mlfp"
"Bug Tracker" = "https://github.com/WhiteSymmetry/mlfp/issues"
