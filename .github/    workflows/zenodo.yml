name: Publish to Zenodo on Release-zenodo.yml

on:
  release:
    types: [published]

jobs:
  publish-to-zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release archive
        run: |
          mkdir -p release-artifact
          cp -r ./* release-artifact/
          cd release-artifact
          zip -r ../release.zip *

      - name: Upload to Zenodo
        uses: nasa/gh-action-upload-zenodo-release@main
        with:
          zenodo_token: ${{ secrets.ZENODO_TOKEN }}
          dir: .
          metadata: |
            {
              "title": "mlf",
              "upload_type": "software",
              "description": "mlf: Mittag-Leffler and Prabhakar function, MLF",
              "creators": [
                {"name": "Keçeci, Mehmet", "orcid": "0000-0001-9937-9839"}
              ],
              "access_right": "open",
              "license": "mit-license"
            }
