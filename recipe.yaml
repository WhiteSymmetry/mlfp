# recipe-noarch-python.yaml
schema_version: 1

# this sets up "context variables" (in this case name and version) that
# can later be used in Jinja expressions
context:
  version: 0.1.4
  name: mlfp

# top level package information (name and version)
package:
  name: mlfp
  version: 0.1.4

source:
  url: https://files.pythonhosted.org/packages/4e/cb/7cb2adbd0cdc8d14f4930284e0467d789ea947fe779d14a635675f87e959/mlfp-0.1.4.tar.gz
  sha256: 1b2efb4f5d5ca5b7f5dddf01dfa2ba32b79297d855b562c923611769be06bb1d

# build number (should be incremented if a new build is made, but version is not incrementing)
build:
  number: 1
  script: python -m pip install --no-deps --ignore-installed .
  noarch: python

# the requirements at build and runtime
requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
   - python >=3.11
   - numpy
   - scipy
   - matplotlib
   - mpmath

# tests to validate that the package works as expected
#tests:
#  requires: []  # veya boş liste
#  - python:
#      imports:
#        - mlfp

# information about the package
about:
  homepage: https://github.com/WhiteSymmetry/mlfp/
  license: MIT
  summary: 'mlfp'
  description: |
    mlfp
  repository: https://github.com/WhiteSymmetry/mlfp/
  documentation: https://github.com/WhiteSymmetry/mlfp/

# the below is conda-forge specific!
extra:
  recipe-maintainers:
    - bilgi
